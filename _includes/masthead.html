<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          {% assign t = site.data.i18n[page.lang] %}
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me">{{ t.home }}</a></li>
          <li class="masthead__menu-item"><a href="#news">{{ t.news }}</a></li>
          <li class="masthead__menu-item"><a href="#publications">{{ t.publications }}</a></li>
          <li class="masthead__menu-item"><a href="#research">{{ t.research }}</a></li>
          <li class="masthead__menu-item"><a href="{% if page.lang == 'zh' %}{{ site.links.blog_zh }}{% else %}{{ site.links.blog_en }}{% endif %}">{{ t.tech_blog }}</a></li>
          <li class="masthead__menu-item"><a href="{{ t.switch_url | relative_url }}" hreflang="{% if page.lang == 'zh' %}en{% else %}zh{% endif %}">{{ t.switch_label }}</a></li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="{{ t.theme_toggle }}" title="{{ t.theme_toggle }}" aria-pressed="false">
        <i class="fas fa-moon theme-toggle__moon" aria-hidden="true"></i><i class="fas fa-sun theme-toggle__sun" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>
